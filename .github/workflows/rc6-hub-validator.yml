name: RC16 META2028 pinned Hub integration
on:
  push:
    branches:
      - dev/rc6-security-integrity
      - dev/rc7-security-evidence
      - dev/rc8-replay-provenance
      - dev/rc9-cee-identity-audit
      - dev/rc10-evidence-proof-gates
      - dev/rc11-cee-primary-source-audit
      - dev/rc12-cee-version-calendar
      - dev/rc13-primary-evidence-gates
      - dev/rc14-cee-report-acquisition
      - dev/rc15-custody-legal-provenance
      - dev/rc16-meta2028-pilot
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-hub-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jotaele44/thehub-pr
          ref: b7a60e613fecb36448c719651625892b2bded565
          path: hub-reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated schema validator
        run: python3 -m pip install jsonschema==4.25.1
      - name: Verify exact external source commit
        run: test "$(git -C hub-reference rev-parse HEAD)" = "b7a60e613fecb36448c719651625892b2bded565"
      - name: Exercise real Hub manifest and package validators
        run: python3 scripts/validate_pinned_hub.py hub-reference
