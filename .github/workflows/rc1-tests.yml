name: RC1 isolated tests
on:
  push:
    branches:
      - dev/evidence-pilot-rc1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit and negative regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate JSON documents
        run: python3 -c "import json,pathlib; [json.loads(p.read_text()) for p in sorted(pathlib.Path('.').rglob('*.json'))]"
