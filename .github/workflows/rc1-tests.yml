name: RC16 META2028 isolated tests
on:
  push:
    branches:
      - dev/evidence-pilot-rc1
      - dev/rc6-security-integrity
      - dev/rc7-security-evidence
      - dev/rc8-replay-provenance
      - dev/rc9-cee-identity-audit
      - dev/rc10-evidence-proof-gates
      - dev/rc11-cee-primary-source-audit
      - dev/rc12-cee-version-calendar
      - dev/rc13-primary-evidence-gates
      - dev/rc14-cee-report-acquisition
      - dev/rc15-custody-legal-provenance
      - dev/rc16-meta2028-pilot
      - dev/rc16-meta2028-pilot
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit and negative regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate JSON documents
        run: python3 -c "import json,pathlib; [json.loads(p.read_text()) for p in sorted(pathlib.Path('.').rglob('*.json'))]"
