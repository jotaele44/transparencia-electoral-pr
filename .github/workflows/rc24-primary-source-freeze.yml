name: RC24 targeted official primary source freeze
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PDF metadata reader
        run: python3 -m pip install pypdf==6.3.0
      - name: Run RC24 fail-closed evidence regressions
        run: python3 -m unittest discover -s tests -v
      - name: Acquire allowlisted official primary sources only
        run: python3 scripts/acquire_rc24_official_records.py
      - name: Upload raw source bytes and acquisition manifest
        uses: actions/upload-artifact@v4
        with:
          name: rc24-official-primary-source-snapshot
          path: artifacts/rc24/
          if-no-files-found: error
          retention-days: 90
